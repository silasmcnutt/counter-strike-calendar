name: Update Counter-Strike calendar

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out calendar
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Test calendar generator
        run: npm test

      - name: Generate calendar
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: npm run generate

      - name: Publish generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ics/finalCalendar.ics jsons/finalCalendar.json jsons/cito-api-state.json
          git diff --cached --quiet || git commit -m "Update calendar"
          git push
