name: Update Counter-Strike Calendar

on:
  schedule:
    - cron: '0 * * * *'  # hourly at minute 0
  workflow_dispatch:

permissions:
  contents: write  # allows GITHUB_TOKEN to push commits

concurrency:
  group: update-calendar
  cancel-in-progress: true

jobs:
  update:
    runs-on: [self-hosted, linux, proxmox]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git push

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate calendar
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: npm run generate

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ics jsons/finalCalendar.json
          if ! git diff --cached --quiet; then
            git commit -m "Update calendar [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi