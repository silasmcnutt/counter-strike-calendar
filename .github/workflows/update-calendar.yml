name: Update Counter-Strike calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out calendar
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HLTV library
        run: |
          git clone --depth 1 https://github.com/SocksPls/hltv-api.git ../hltv-api
          python -m pip install --upgrade pip
          grep -v '^lxml==' ../hltv-api/requirements.txt > /tmp/hltv-requirements.txt
          python -m pip install -r /tmp/hltv-requirements.txt
          python -m pip install 'lxml>=5'

      - name: Install Node dependencies
        run: npm ci

      - name: Test calendar generator
        run: npm test

      - name: Generate calendar
        env:
          HLTV_API_PATH: ../hltv-api
        run: npm run generate

      - name: Publish generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ics/finalCalendar.ics jsons/finalCalendar.json
          git diff --cached --quiet || git commit -m "Update calendar"
          git push
